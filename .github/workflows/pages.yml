name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp \
            index.html \
            property-maintenance-sopron.html \
            handyman-services-sopron.html \
            painting-wall-repairs-sopron.html \
            garden-maintenance-sopron.html \
            cleaning-services-sopron.html \
            airbnb-property-maintenance-sopron.html \
            property-management-for-foreign-owners-sopron.html \
            styles.css \
            styles-base.css \
            script.js \
            robots.txt \
            sitemap.xml \
            _site/
          if [ -f CNAME ]; then
            cp CNAME _site/CNAME
            test -s _site/CNAME
          fi
          cp -R assets _site/assets
          cp -R hu _site/hu

          # Single source of truth for cache-busting: every HTML file carries
          # the literal placeholder "__ASSET_VERSION__" (on styles.css/script.js
          # links and on asset image src attributes) instead of a hand-maintained
          # version string. Here -- and only here -- it is substituted for a
          # hash of the actual shipped script/style content, so there is nothing
          # left to forget to bump by hand and no way for it to drift out of
          # sync across 16 files.
          ASSET_VERSION="$(cat styles.css styles-base.css script.js | sha256sum | cut -c1-16)"
          echo "Computed asset version: $ASSET_VERSION"
          grep -rl "__ASSET_VERSION__" _site | while read -r file; do
            sed -i "s/__ASSET_VERSION__/$ASSET_VERSION/g" "$file"
          done
          if grep -rq "__ASSET_VERSION__" _site; then
            echo "::error::Unsubstituted __ASSET_VERSION__ placeholder remained in _site"
            exit 1
          fi

          test "$(head -n 1 _site/index.html)" = "<!DOCTYPE html>"
          grep -F "<link rel=\"stylesheet\" href=\"styles.css?v=$ASSET_VERSION\">" _site/index.html
          grep -F "<script src=\"script.js?v=$ASSET_VERSION\" defer></script>" _site/index.html
          grep -F "<link rel=\"stylesheet\" href=\"../styles.css?v=$ASSET_VERSION\">" _site/hu/index.html
          grep -F "<script src=\"../script.js?v=$ASSET_VERSION\" defer></script>" _site/hu/index.html
          test -s _site/property-maintenance-sopron.html
          test -s _site/handyman-services-sopron.html
          test -s _site/painting-wall-repairs-sopron.html
          test -s _site/garden-maintenance-sopron.html
          test -s _site/cleaning-services-sopron.html
          test -s _site/airbnb-property-maintenance-sopron.html
          test -s _site/property-management-for-foreign-owners-sopron.html
          test -s _site/hu/index.html
          test -s _site/hu/ingatlan-karbantartas-sopron.html
          test -s _site/hu/ezermester-sopron.html
          test -s _site/hu/szobafestes-faljavitas-sopron.html
          test -s _site/hu/kertfenntartas-sopron.html
          test -s _site/hu/takaritas-sopron.html
          test -s _site/hu/airbnb-karbantartas-sopron.html
          test -s _site/hu/ingatlankezeles-kulfoldi-tulajdonosoknak-sopron.html
          test -s _site/styles.css
          test -s _site/styles-base.css
          test -s _site/script.js
          test -d _site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
